<!DOCTYPE html>
<html lang ="en">
    <head>
        <title>Box Model Practice</title>
        <script src ="../validate.js"></script>
    <style>
        #redbox{
            background-color:red;
            height:100px;
            width:100px;
            border:2px black solid;
            background-clip:content-box;
            margin-left:200px;
        }
        
        #bluebox{
            background-color:blue;
            height:100px;
            width:100px;
            border:2px black solid;
            padding:50px;
            background-clip:content-box;
            margin-left:300px;
        }
        #greenbox{
            background-color:green;
            height:100px;
            width:100px;
            border:2px black solid;
            padding-left:25px;
            background-clip:content-box;
        }
        #yellowbox{
            background-color:yellow;
            height:100px;
            width:100px;
            border:2px black solid;
            background-clip:content-box;
            padding-left:25px;
            padding-right:25px;
            padding-top:50px;
            margin-left:200px;
        }
        #purplebox{
            background-color:purple;
            height:100px;
            width:100px;
            border:2px black solid;
            background-clip:content-box;
            margin-left:100px;
        }
        #whitebox{
            background-color:white;
            height:100px;
            width:100px;
            border:2px black solid;
            background-clip:content-box;
            margin-left:100px;
        }
    </style>
    </head>
    <body>
        <h1>Look at them boxes</h1>
        <div id="redbox"></div>
        <div id="bluebox"></div>
        <div id="greenbox"></div>
        <div id="yellowbox"></div>
        <div id="purplebox"></div>
        <div id="whitebox"></div>
    </body>
</html>
